name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clawdengine
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: System packages for wgpu/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libasound2-dev libudev-dev pkg-config

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clawdengine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('clawdengine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release
