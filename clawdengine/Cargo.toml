[package]
name = "clawdengine"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "27.0.1"
winit = "0.30.12"
egui = "0.33.3"
egui-wgpu = "0.33.3"
egui-winit = "0.33.3"
egui_dock = "0.18.0"
glam = { version = "0.31.0", features = ["serde"] }
tobj = "4.0.3"
gltf = "1.4"
image = "0.25.5"
bytemuck = { version = "1.25.0", features = ["derive"] }
pollster = "0.4.0"
serde = { version = "1.0.217", features = ["derive"] }
ron = "0.8.1"
anyhow = "1.0.101"
log = "0.4.25"
env_logger = "0.11.6"
rodio = "0.21"

# Optimize everything in dev mode (near-release speed, still with debug info)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
